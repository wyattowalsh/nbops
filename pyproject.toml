[project]
name = "nbops"
version = "0.1.0"
description = "nbops - lightweight operations toolkit for Jupyter notebooks (CLI + API)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "nbops maintainers" }]
keywords = ["jupyter", "notebook", "cli", "fastapi", "devops"]
dependencies = [
    "typer>=0.15.1",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "loguru>=0.7.3",
    "pydantic>=2.10.4",
]

[project.scripts]
nbops = "nbops.cli:app"

[project.urls]
Homepage = "https://github.com/wyattowalsh/nbops"
Repository = "https://github.com/wyattowalsh/nbops"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nbops"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["nbops"]
branch = true
